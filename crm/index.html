<style>
:root{
  --grafite:#292827; --grafite-2:#1b1a19; --grafite-3:#3d3b39;
  --verde:#30a560; --verde-2:#26874e; --verde-claro:#e7f5ec;
  --ambar:#c9822f; --ambar-claro:#fbf1e2;
  --verm:#b4453a; --verm-claro:#fbecea;
  --azul:#2f6f8a; --azul-claro:#e8f1f5;
  --bg:#f5f6f4; --surface:#fff; --surface-2:#eef1ee;
  --ink:#1a1c1b; --ink-2:#565c58; --ink-3:#8a918c;
  --side:#1c1e1d; --side-2:#2c302d; --side-ink:#b6bdb8;
  --line:#e2e6e2; --line-2:#eef1ee;
  --r:12px; --r-lg:16px;
  --sh:0 1px 2px rgba(26,28,27,.05);
  --sh-md:0 12px 26px -16px rgba(26,28,27,.4);
  --sh-lg:0 28px 64px -30px rgba(26,28,27,.5);
  --mk-escuro:var(--ink); --mk-verde:var(--verde); --mk-contorno:#fff;
  --mola:cubic-bezier(.22,1,.36,1);
}
:root[data-tema="escuro"]{
  --bg:#121413; --side:#0d0f0e; --side-2:#232724; --surface:#1a1d1b; --surface-2:#232725;
  --ink:#e9ece9; --ink-2:#a6ada8; --ink-3:#79817b;
  --verde:#45bd78; --verde-2:#5bcd8b; --verde-claro:#16301f;
  --ambar:#d9963f; --ambar-claro:#2e2517;
  --verm:#d4695d; --verm-claro:#33201d;
  --azul:#5d9bb8; --azul-claro:#1a2a31;
  --line:#2a2f2b; --line-2:#212622;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.55 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3{margin:0;letter-spacing:-.03em;font-weight:800}
p{margin:0 0 10px}
.hide{display:none !important}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:3px solid var(--bg)}

/* ---------- botões e campos ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;
  border-radius:11px;font-weight:700;font-size:13.5px;transition:.16s;white-space:nowrap}
.btn-p{background:var(--verde);color:#fff;box-shadow:0 8px 18px -12px var(--verde)}
.btn-p:hover{background:var(--verde-2);transform:translateY(-1px)}
.btn-g{border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.btn-g:hover{border-color:var(--verde);color:var(--verde-2)}
.btn-x{color:var(--verm)}
.btn-x:hover{background:var(--verm-claro)}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.campo{margin-bottom:13px}
.campo label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:var(--ink-2)}
.campo input,.campo select,.campo textarea{width:100%;padding:10px 12px;border-radius:10px;
  border:1.5px solid var(--line);background:var(--surface);outline:none;transition:.15s}
.campo textarea{min-height:90px;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--verde);
  box-shadow:0 0 0 3px var(--verde-claro)}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.dica{font-size:11.5px;color:var(--ink-3);margin:5px 0 0}

/* ---------- entrada ---------- */
#auth{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:22px;
  background:linear-gradient(152deg,#1e201f 0%,#1d3325 52%,#15402c 100%)}
.auth-caixa{background:var(--surface);border-radius:22px;padding:34px;width:min(400px,100%);
  box-shadow:var(--sh-lg)}
.auth-marca{display:flex;align-items:center;gap:11px;margin-bottom:22px}
.auth-marca .mk{width:40px;height:auto}
.auth-marca b{font-size:18px;letter-spacing:-.035em;font-weight:800}
.auth-marca b i{font-style:normal;color:var(--verde)}
.auth-caixa h2{font-size:19px;margin-bottom:5px}
.auth-caixa .ab{color:var(--ink-2);font-size:13.5px;margin-bottom:20px}

/* ---------- estrutura ---------- */
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:20px 13px;display:flex;
  flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.side-marca{display:flex;align-items:center;gap:10px;padding:2px 8px 22px}
.side-marca .mk{width:38px;height:auto;--mk-escuro:#3d3b39;--mk-contorno:#fff}
.side-marca b{color:#fff;font-size:16px;letter-spacing:-.035em;font-weight:800;line-height:1.1}
.side-marca b i{font-style:normal;color:var(--verde)}
.side-marca .sub{display:block;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;
  color:#8b968e;margin-top:3px;font-weight:700}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;
  font-size:13.5px;font-weight:500;color:var(--side-ink);transition:.14s}
.nav a:hover{background:var(--side-2);color:#fff}
.nav a.on{background:var(--side-2);color:#fff;font-weight:700;box-shadow:inset 3px 0 0 var(--verde)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .ic{width:17px;text-align:center;opacity:.85;font-size:13px}
.nav a.on .ic{opacity:1}
.nav .conta{margin-left:auto;background:var(--side-2);border-radius:99px;padding:1px 7px;
  font-size:11px;font-weight:700;color:#cfd8d2}
.nav a.on .conta{background:var(--verde);color:#fff}
.side-pe{margin-top:auto;display:flex;gap:7px;align-items:center;padding-top:14px}
.side-pe button{flex:1;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px;
  font-size:12px;color:var(--side-ink);transition:.14s}
.side-pe button:hover{background:var(--side-2);color:#fff}

.main{min-width:0;display:flex;flex-direction:column}
.topo{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 24px;
  display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
.topo h1{font-size:19px}
.topo .crumb{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.topo .sp{flex:1}
.busca{position:relative}
.busca input{padding:9px 12px 9px 32px;border-radius:10px;border:1.5px solid var(--line);
  background:var(--surface);width:230px;outline:none;transition:.15s}
.busca input:focus{border-color:var(--verde);box-shadow:0 0 0 3px var(--verde-claro);width:280px}
.busca .lupa{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:12px}
.conteudo{padding:22px 24px 60px;min-width:0}

/* ---------- painéis ---------- */
.painel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:20px;box-shadow:var(--sh)}
.painel h2{font-size:16px;margin-bottom:4px}
.painel .hint{color:var(--ink-2);font-size:13px;margin:0 0 14px}
.painel-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.rot{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
  font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.rot::before{content:"";width:14px;height:2px;border-radius:2px;background:var(--verde)}

.numeros{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px;margin-bottom:22px}
.num{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:16px 18px;box-shadow:var(--sh)}
.num span{color:var(--ink-2);font-size:12.5px;display:block}
.num b{display:block;font-size:26px;letter-spacing:-.04em;margin-top:5px;line-height:1.1}
.num .pe{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.num.destaque{background:linear-gradient(150deg,#242626,#1d3d2b);border:0;color:#e9ede9}
.num.destaque span{color:#a9bdb0}
.num.destaque b{color:#fff}
.num.destaque .pe{color:#8ba296}

.cols{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start}
@media (max-width:1100px){.cols{grid-template-columns:1fr}}

/* ---------- listas ---------- */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
  font-weight:700;padding:0 10px 9px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle;font-size:13.5px}
tr:last-child td{border-bottom:0}
tbody tr{transition:.12s}
tbody tr:hover{background:var(--surface-2)}
.linha-click{cursor:pointer}
.vazio{text-align:center;padding:34px 18px;color:var(--ink-3);font-size:13.5px}
.vazio b{display:block;color:var(--ink-2);font-size:14.5px;margin-bottom:5px}

.av{width:33px;height:33px;border-radius:50%;background:var(--verde-claro);color:var(--verde-2);
  display:grid;place-items:center;font-weight:800;font-size:12.5px;flex:none}
.pessoa{display:flex;align-items:center;gap:10px;min-width:0}
.pessoa b{display:block;font-size:13.5px;line-height:1.3}
.pessoa span{color:var(--ink-3);font-size:11.5px}

/* ---------- etiquetas ---------- */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
  padding:3px 9px;border-radius:99px;white-space:nowrap;line-height:1.5}
.tag-x{opacity:.55;font-weight:700;cursor:pointer;margin-left:1px}
.tag-x:hover{opacity:1}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.pino{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;
  color:var(--ink-2);white-space:nowrap}
.pino i{width:8px;height:8px;border-radius:50%;flex:none}

.etapa{font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.e-novo{background:var(--azul-claro);color:var(--azul)}
.e-conversando{background:var(--ambar-claro);color:#a3641f}
.e-proposta{background:var(--verde-claro);color:var(--verde-2)}
.e-fechado{background:var(--verde);color:#fff}
.e-perdido{background:var(--surface-2);color:var(--ink-3)}

/* ---------- funil ---------- */
.funil{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:13px;
  overflow-x:auto;padding-bottom:8px;align-items:start}
.coluna{background:var(--surface-2);border-radius:var(--r-lg);padding:11px;min-height:150px;
  transition:.16s;border:2px dashed transparent}
.coluna.alvo{border-color:var(--verde);background:var(--verde-claro)}
.coluna-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:3px 4px 11px;font-size:12px;font-weight:800}
.coluna-hd .qt{color:var(--ink-3);font-weight:700;font-size:11.5px}
.coluna-hd .vl{display:block;font-size:11px;color:var(--ink-3);font-weight:600;margin-top:1px}
.ficha{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:12px;margin-bottom:9px;cursor:grab;box-shadow:var(--sh);transition:.16s}
.ficha:hover{box-shadow:var(--sh-md);transform:translateY(-2px);border-color:var(--verde)}
.ficha:active{cursor:grabbing}
.ficha.arrastando{opacity:.4}
.ficha b{display:block;font-size:13.5px;line-height:1.3;margin-bottom:3px}
.ficha .meta{color:var(--ink-3);font-size:11.5px;margin-bottom:8px}
.ficha .rodape{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.ficha .valor{font-size:13px;font-weight:800;letter-spacing:-.02em}
.alerta{color:var(--verm);font-weight:700;font-size:11px}

/* ---------- ficha do contato ---------- */
.ficha-grade{display:grid;grid-template-columns:1.45fr 1fr;gap:18px;align-items:start}
@media (max-width:1000px){.ficha-grade{grid-template-columns:1fr}}
.linha-tempo{display:grid;gap:0}
.evento{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line-2)}
.evento:last-child{border-bottom:0}
.evento .bolha{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;
  font-size:12px;font-weight:800;background:var(--surface-2);color:var(--ink-3)}
.evento.t-nota .bolha{background:var(--surface-2)}
.evento.t-whatsapp .bolha{background:var(--verde-claro);color:var(--verde-2)}
.evento.t-site .bolha{background:var(--azul-claro);color:var(--azul)}
.evento.t-etapa .bolha{background:var(--ambar-claro);color:#a3641f}
.evento .corpo{flex:1;min-width:0}
.evento .corpo p{margin:0;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.evento .quando{font-size:11.5px;color:var(--ink-3);margin-top:3px}

.tarefa{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line-2)}
.tarefa:last-child{border-bottom:0}
.tarefa input{accent-color:var(--verde);width:16px;height:16px;margin-top:2px;flex:none;cursor:pointer}
.tarefa .tx{flex:1;min-width:0;font-size:13.5px}
.tarefa .tx b{display:block;font-weight:600}
.tarefa .tx span{font-size:11.5px;color:var(--ink-3)}
.tarefa.feita .tx b{text-decoration:line-through;color:var(--ink-3)}
.tarefa .vencida{color:var(--verm);font-weight:700}
.tarefa .hoje{color:var(--ambar);font-weight:700}

/* ---------- barras ---------- */
.barra-item{margin-bottom:12px}
.barra-item:last-child{margin-bottom:0}
.barra-topo{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.barra-topo b{font-weight:700}
.barra{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.barra i{display:block;height:100%;border-radius:99px;transition:width .5s var(--mola)}

/* ---------- modal ---------- */

/* ---------------------- CAMADA DE DADOS ---------------------- */
const api = {
  async sel(tab, filtro = {}){
    if(DEMO) return (D[tab] ?? []).filter(r => Object.entries(filtro).every(([k,v]) =>
      Array.isArray(v) ? v.includes(r[k]) : r[k] === v));
    let q = sb.from(tab).select('*');
    for(const [k,v] of Object.entries(filtro)) q = Array.isArray(v) ? q.in(k,v) : q.eq(k,v);
    const { data, error } = await q;
    if(error) return api.falhou(tab, 'ler', error) ?? [];
    return data ?? [];
  },
  async ins(tab, row){
    if(DEMO){ const r = { id: uid(), criado_em: new Date().toISOString(),
                          atualizado_em: new Date().toISOString(), ...row };
              (D[tab] ??= []).push(r); return r; }
    const { data, error } = await sb.from(tab).insert(row).select().single();
    if(error) return api.falhou(tab, 'gravar', error);
    return data;
  },
  async upd(tab, id, patch){
    if(DEMO){ const r = (D[tab] ?? []).find(x => x.id === id);
              if(r) Object.assign(r, patch, { atualizado_em: new Date().toISOString() });
              return r ?? null; }
    const { data, error } = await sb.from(tab).update(patch).eq('id', id).select().single();
    if(error) return api.falhou(tab, 'salvar', error);
    return data;
  },
  async del(tab, filtro){
    if(DEMO){ D[tab] = (D[tab] ?? []).filter(r =>
                !Object.entries(filtro).every(([k,v]) => r[k] === v)); return true; }
    let q = sb.from(tab).delete();
    for(const [k,v] of Object.entries(filtro)) q = q.eq(k,v);
    const { error } = await q;
    if(error){ api.falhou(tab, 'apagar', error); return false; }
    return true;
  },
  falhou(tab, acao, error){
    console.error(`[${tab}] ${acao}:`, error);
    const cod = error?.code ?? '', msg = String(error?.message ?? '');
    let t;
    if(cod === '42P01') t = `A tabela ${tab} não existe. Rode o schema.sql do CRM no Supabase.`;
    else if(cod === '42703') t = `Falta uma coluna em ${tab}. Rode o schema.sql do CRM de novo.`;
    else if(cod === '42501' || /row-level security/i.test(msg))
      t = `Sem permissão em ${tab}. Confira se a sua conta está como admin.`;
    else if(cod === 'PGRST116') t = `Nada foi alterado em ${tab}. A linha não existe ou o RLS barrou.`;
    else t = `Não consegui ${acao} em ${tab}. ${msg.slice(0, 80)}`;
    aviso(t);
    return null;
  },
};

  M.tags.sort((a,b) => (a.grupo ?? '').localeCompare(b.grupo ?? '') || (a.ordem ?? 99) - (b.ordem ?? 99));
}

const pinta = (hex, alpha) => {
  const h = String(hex || '#565c58').replace('#','');
  const n = parseInt(h.length === 3 ? h.split('').map(c=>c+c).join('') : h, 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${alpha})`;
};
const chipTag = (t, comX) => `<span class="tag" style="background:${pinta(t.cor,.14)};color:${esc(t.cor)}">
  ${esc(t.nome)}${comX ? `<span class="tag-x" data-tiratag="${t.id}">✕</span>` : ''}</span>`;
const chipNegocio = n => n ? `<span class="pino"><i style="background:${esc(n.cor)}"></i>${esc(n.nome)}</span>` : '';
const chipEtapa = e => `<span class="etapa e-${esc(e)}">${esc(etapaNome(e))}</span>`;

function pintarMenu(){
  const atual = (location.hash || '#/painel').split('/')[1];
  $('#nav').innerHTML = MENU.map(m => {
    const n = m.conta ? m.conta() : 0;
    return `<a href="#/${m.rota}" class="${m.rota === atual ? 'on' : ''}">
      <span class="ic">${m.ic}</span>${m.nome}
      ${n ? `<span class="conta">${n}</span>` : ''}</a>`;
  }).join('');
}

const TELAS = {};
async function rotear(){
  if(!EU) return;
  const [, base, arg] = (location.hash || '#/painel').split('/');
  pintarMenu();
  const m = MENU.find(x => x.rota === base);
  $('#crumb').textContent = m?.nome ?? 'CRM';
  $('#titulo').textContent = m?.nome ?? 'CRM';
  await (TELAS[base] ?? TELAS.painel)(arg);
  window.scrollTo(0, 0);
}

TELAS.painel = async () => {
  const mes = hoje().slice(0, 7);
  const mesPassado = (() => { const d = new Date(hoje() + 'T12:00:00'); d.setMonth(d.getMonth() - 1);
                              return d.toISOString().slice(0, 7); })();

  const noMes   = M.receitas.filter(r => String(r.recebido_em).startsWith(mes));
  const noAnt   = M.receitas.filter(r => String(r.recebido_em).startsWith(mesPassado));
  const entrou  = noMes.reduce((s, r) => s + r.valor_centavos, 0);
  const entrouA = noAnt.reduce((s, r) => s + r.valor_centavos, 0);
  const variacao = entrouA ? Math.round(((entrou - entrouA) / entrouA) * 100) : null;

  const emAberto = M.contatos.filter(c => ['novo','conversando','proposta'].includes(c.etapa));
  const previsto = emAberto.reduce((s, c) => s + (c.valor_centavos || 0), 0);
  const vencidas = abertas().filter(t => t.vence_em < hoje());
  const paraHoje = abertas().filter(t => t.vence_em === hoje());

  // receita do mês por negócio
  const porNegocio = M.negocios.map(n => ({
    n, total: noMes.filter(r => r.negocio_id === n.id).reduce((s, r) => s + r.valor_centavos, 0)
  })).filter(x => x.total > 0).sort((a, b) => b.total - a.total);
  const maior = porNegocio[0]?.total || 1;

  $('#conteudo').innerHTML = `
    <div class="numeros">
      <div class="num destaque"><span>Entrou este mês</span><b>${BRL(entrou)}</b>
        <div class="pe">${variacao === null ? 'primeiro mês com registro'
          : `${variacao >= 0 ? '+' : ''}${variacao}% sobre ${BRL(entrouA)} no mês passado`}</div></div>
      <div class="num"><span>No funil, se tudo fechar</span><b>${BRL(previsto)}</b>
        <div class="pe">${emAberto.length} em aberto</div></div>
      <div class="num"><span>Leads do site esperando</span><b>${novos.length}</b>
        <div class="pe">${novos.length ? 'veja em Entrada' : 'nenhum parado'}</div></div>
      <div class="num"><span>Tarefas atrasadas</span>
        <b style="${vencidas.length ? 'color:var(--verm)' : ''}">${vencidas.length}</b>
        <div class="pe">${paraHoje.length} para hoje</div></div>
    </div>

    <div class="cols">
      <div style="display:grid;gap:18px">
        <div class="painel">
          <div class="panel-hd painel-hd"><div><h2>O que precisa de você</h2>
            <p class="hint">Atrasadas primeiro, depois as de hoje.</p></div>
            <a class="btn btn-g btn-sm" href="#/tarefas">Ver todas</a></div>
          ${[...vencidas, ...paraHoje].slice(0, 7).map(t => linhaTarefa(t)).join('')
            || '<div class="vazio"><b>Nada atrasado</b>Você está em dia.</div>'}
        </div>

        <div class="painel">
          <div class="painel-hd"><div><h2>Mexidos por último</h2>
            <p class="hint">Quem teve movimento recente.</p></div>
            <a class="btn btn-g btn-sm" href="#/contatos">Ver contatos</a></div>
          ${[...M.contatos].sort((a,b) => String(b.atualizado_em).localeCompare(String(a.atualizado_em)))
            .slice(0, 6).map(c => `
            <div class="tarefa linha-click" data-abre="${c.id}">
              <span class="av">${esc(iniciais(c.nome))}</span>
              <span class="tx"><b>${esc(c.nome)}</b>
                <span>${esc(c.empresa || c.cidade || 'sem empresa')} · ${quando(c.atualizado_em)}</span></span>
              ${chipEtapa(c.etapa)}
            </div>`).join('') || '<div class="vazio">Nenhum contato ainda.</div>'}
        </div>
      </div>

      <div style="display:grid;gap:18px">
        <div class="painel">
          <h2>Receita do mês por negócio</h2>
          <p class="hint">Só o que já entrou de verdade.</p>
          ${porNegocio.length ? porNegocio.map(({n, total}) => `
            <div class="barra-item">
              <div class="barra-topo"><span>${esc(n.nome)}</span><b>${BRL(total)}</b></div>
              <div class="barra"><i style="width:${Math.round(total / maior * 100)}%;background:${esc(n.cor)}"></i></div>
            </div>`).join('') : '<div class="vazio">Nada recebido neste mês.</div>'}
        </div>

        <div class="painel">
          <h2>Funil agora</h2>
          <p class="hint">Quantas pessoas em cada etapa.</p>
          ${ETAPAS.map(e => {
            const qt = M.contatos.filter(c => c.etapa === e.id).length;
            const vl = M.contatos.filter(c => c.etapa === e.id).reduce((s,c) => s + (c.valor_centavos||0), 0);
            const max = Math.max(1, ...ETAPAS.map(x => M.contatos.filter(c => c.etapa === x.id).length));
            return `<div class="barra-item">
              <div class="barra-topo"><span>${esc(e.nome)}</span>
                <b>${qt}${vl ? ` · ${BRLcurto(vl)}` : ''}</b></div>
              <div class="barra"><i style="width:${Math.round(qt / max * 100)}%;background:${e.cor}"></i></div>
            </div>`;
          }).join('')}

      </div>
    </div>`;

  ligarTarefas();
  $$('[data-abre]').forEach(el => el.onclick = () => location.hash = '#/contato/' + el.dataset.abre);

function linhaTarefa(t){
  const c = M.contatos.find(x => x.id === t.contato_id);
  const atrasada = !t.feito && t.vence_em < hoje();
  const eHoje = !t.feito && t.vence_em === hoje();
  return `<div class="tarefa ${t.feito ? 'feita' : ''}">
    <input type="checkbox" data-feito="${t.id}" ${t.feito ? 'checked' : ''}>
    <span class="tx"><b>${esc(t.titulo)}</b>
      <span>${c ? esc(c.nome) : 'sem contato'} ·
        <span class="${atrasada ? 'vencida' : eHoje ? 'hoje' : ''}">${
          atrasada ? 'atrasada desde ' + dataBR(t.vence_em)
          : eHoje ? 'para hoje' : dataBR(t.vence_em)}</span></span></span>
    ${c ? `<button class="btn btn-g btn-sm" data-abre="${c.id}">Abrir</button>` : ''}
  </div>`;
}

function ligarTarefas(){
  $$('[data-feito]').forEach(el => el.onchange = async () => {
    const ok = await api.upd('crm_tarefas', el.dataset.feito,
      { feito: el.checked, feito_em: el.checked ? new Date().toISOString() : null });
    if(!ok){ el.checked = !el.checked; return; }
    await recarregar(); rotear();
  });
  $$('[data-abre]').forEach(el => el.onclick = () => location.hash = '#/contato/' + el.dataset.abre);
}

  abriu_produto:'Abriu um produto', perguntou_produto:'Perguntou sobre',

/* Um lead vira contato com a etiqueta do perfil e a timeline do site junto. */
async function importarLead(leadId, emLote){
  const l = M.leads.find(x => x.id === leadId); if(!l) return;
  const padrao = M.negocios.find(n => n.ativo) ?? M.negocios[0];

  const c = await api.ins('crm_contatos', {
    nome: l.nome, whatsapp: l.whatsapp, email: l.email || null,
    negocio_id: padrao?.id ?? null, etapa: 'novo', valor_centavos: 0,
    origem: l.origem || 'site', lead_id: l.id,
  });
  if(!c) return;

  // a etiqueta de nicho sai do perfil que a pessoa marcou no portão
  const mapa = { 'Veterinário autônomo':'Veterinário autônomo', 'Dono ou gestor de clínica':'Dono de clínica',
                 'Recém-formado':'Recém-formado' };
  const alvo = M.tags.find(t => t.grupo === 'nicho' && t.nome === (mapa[l.perfil] ?? l.perfil));
  if(alvo) await api.ins('crm_contato_tags', { contato_id: c.id, tag_id: alvo.id });
  const canal = M.tags.find(t => t.grupo === 'canal' && t.nome.toLowerCase() === String(l.origem||'site').toLowerCase());
  if(canal) await api.ins('crm_contato_tags', { contato_id: c.id, tag_id: canal.id });

  for(const e of M.eventos.filter(x => x.lead_id === l.id)
        .sort((a,b) => String(a.criado_em).localeCompare(String(b.criado_em)))){
    await api.ins('crm_interacoes', { contato_id: c.id, tipo: 'site',
      texto: rotuloEvento(e.tipo) + (e.detalhe ? ': ' + e.detalhe : ''), criado_em: e.criado_em });
  }

  if(emLote) return;
  await recarregar();
  aviso('Lead no funil.');
  location.hash = '#/contato/' + c.id;
}

let filtroNegocio = '', filtroTag = '';

TELAS.funil = async () => {
  const lista = M.contatos.filter(c =>
    (!filtroNegocio || c.negocio_id === filtroNegocio) &&
    (!filtroTag || M.vinculos.some(v => v.contato_id === c.id && v.tag_id === filtroTag)));

  $('#conteudo').innerHTML = `
    ${barraFiltros()}
    <div class="funil">
      ${ETAPAS.map(e => {
        const desta = lista.filter(c => c.etapa === e.id)
          .sort((a,b) => String(b.atualizado_em).localeCompare(String(a.atualizado_em)));
        const soma = desta.reduce((s,c) => s + (c.valor_centavos || 0), 0);
        return `<div class="coluna" data-etapa="${e.id}">
          <div class="coluna-hd">
            <span><span style="color:${e.cor}">●</span> ${esc(e.nome)}
              ${soma ? `<span class="vl">${BRLcurto(soma)}</span>` : ''}</span>
            <span class="qt">${desta.length}</span>
          </div>
          ${desta.map(c => fichaFunil(c)).join('')}
        </div>`;
      }).join('')}
    </div>`;

  ligarFiltros();
  ligarArrasto();
};

function fichaFunil(c){
  const t = tagsDe(c.id).slice(0, 2);
  const proxima = tarefasDe(c.id).filter(x => !x.feito).sort((a,b) => a.vence_em.localeCompare(b.vence_em))[0];
  const atrasada = proxima && proxima.vence_em < hoje();
  return `<div class="ficha" draggable="true" data-id="${c.id}">
    <b>${esc(c.nome)}</b>
    <div class="meta">${esc(c.empresa || c.cidade || 'sem empresa')}</div>
    ${t.length ? `<div class="tags">${t.map(x => chipTag(x)).join('')}</div>` : ''}
    <div class="rodape">
      ${chipNegocio(negocioDe(c.negocio_id))}
      ${c.valor_centavos ? `<span class="valor">${BRLcurto(c.valor_centavos)}</span>` : ''}
    </div>
    ${proxima ? `<div style="margin-top:7px;font-size:11.5px;color:var(--ink-3)">
      ${atrasada ? '<span class="alerta">atrasada</span> ' : ''}${esc(proxima.titulo)}</div>` : ''}
  </div>`;
}

function barraFiltros(){
  return `<div class="filtros">
    <select id="fNeg"><option value="">Todos os negócios</option>
      ${M.negocios.map(n => `<option value="${n.id}" ${filtroNegocio === n.id ? 'selected' : ''}>${esc(n.nome)}</option>`).join('')}
    </select>
    <select id="fTag"><option value="">Todas as etiquetas</option>
      ${['nicho','porte','temperatura','canal'].map(g => {
        const ts = M.tags.filter(t => t.grupo === g);
        return ts.length ? `<optgroup label="${esc(g)}">${ts.map(t =>
          `<option value="${t.id}" ${filtroTag === t.id ? 'selected' : ''}>${esc(t.nome)}</option>`).join('')}</optgroup>` : '';
      }).join('')}
    </select>
    ${(filtroNegocio || filtroTag) ? '<button class="limpar" id="fLimpar">limpar filtros</button>' : ''}
  </div>`;
}

function ligarFiltros(){
  const n = $('#fNeg'), t = $('#fTag'), l = $('#fLimpar');
  if(n) n.onchange = () => { filtroNegocio = n.value; rotear(); };
  if(t) t.onchange = () => { filtroTag = t.value; rotear(); };
  if(l) l.onclick  = () => { filtroNegocio = filtroTag = ''; rotear(); };
}

/* Arrastar entre colunas muda a etapa e deixa registro na timeline. */
function ligarArrasto(){
  let pegou = null;
  $$('.ficha').forEach(f => {
    f.ondragstart = e => { pegou = f.dataset.id; f.classList.add('arrastando');
                           e.dataTransfer.effectAllowed = 'move'; };
    f.ondragend   = () => { pegou = null; f.classList.remove('arrastando');
                            $$('.coluna').forEach(c => c.classList.remove('alvo')); };
  });
  $$('.coluna').forEach(col => {
    col.ondragover  = e => { e.preventDefault(); col.classList.add('alvo'); };
    col.ondragleave = () => col.classList.remove('alvo');
    col.ondrop = async e => {
      e.preventDefault(); col.classList.remove('alvo');
      if(!pegou) return;
      const nova = col.dataset.etapa;
      const c = M.contatos.find(x => x.id === pegou);
      if(!c || c.etapa === nova) return;
      await moverEtapa(c, nova);
    };
  });
}

async function moverEtapa(c, nova){
  const antiga = c.etapa;
  const ok = await api.upd('crm_contatos', c.id, { etapa: nova });
  if(!ok) return;
  await api.ins('crm_interacoes', { contato_id: c.id, tipo: 'etapa',
    texto: `Moveu de ${etapaNome(antiga)} para ${etapaNome(nova)}` });

  await recarregar();
  rotear();

  // Fechou: oferece lançar a receita na hora, que é quando você lembra.
  if(nova === 'fechado'){
    const v = await formModal('Fechou. Lançar o que entrou?', [
      {k:'descricao', l:'Descrição', v:`${c.nome}`},
      {k:'valor', l:'Valor (R$)', v: deCentavos(c.valor_centavos), ph:'0,00'},
      {k:'metodo', l:'Como recebeu', t:'select',
       opts:[['pix','Pix'],['cartão','Cartão'],['boleto','Boleto'],['dinheiro','Dinheiro'],['outro','Outro']], v:'pix'},
      {k:'recebido_em', l:'Data', t:'date', v: hoje()},
    ], 'Lançar receita');
    if(v && paraCentavos(v.valor) > 0){
      await api.ins('crm_receitas', { contato_id: c.id, negocio_id: c.negocio_id,
        descricao: v.descricao, valor_centavos: paraCentavos(v.valor),
        metodo: v.metodo, recebido_em: v.recebido_em });
      await recarregar(); rotear(); aviso('Receita lançada.');
    }
  }
  if(nova === 'perdido'){
    const v = await formModal('Por que perdeu?', [
      {k:'motivo', l:'Motivo', t:'textarea', v: c.motivo_perda ?? '',
       dica:'Daqui a seis meses isso vale mais que o lead em si.'},
    ], 'Guardar');
    if(v && v.motivo.trim()){
      await api.upd('crm_contatos', c.id, { motivo_perda: v.motivo.trim() });
      await recarregar(); rotear();
    }
  }
}

function abrirZap(cid){
  const c = M.contatos.find(x => x.id === cid);

  window.open(`https://wa.me/${d.length <= 11 ? '55' + d : d}`, '_blank', 'noopener');

/* ---------------------- criar e editar contato ---------------------- */
async function formContato(id){
  const c = id ? M.contatos.find(x => x.id === id) : {};
  const v = await formModal(id ? 'Editar dados' : 'Novo contato', [
    {k:'nome', l:'Nome', v:c.nome, ph:'Como a pessoa se chama'},
    {k:'whatsapp', l:'WhatsApp', v:c.whatsapp, ph:'79 99999 9999'},
    {k:'email', l:'E-mail', v:c.email, ph:'opcional'},
    {k:'empresa', l:'Empresa ou clínica', v:c.empresa, ph:'opcional'},
    {k:'cidade', l:'Cidade', v:c.cidade, ph:'opcional'},
    {k:'negocio_id', l:'Negócio', t:'select',
     opts:[['','sem negócio'], ...M.negocios.map(n => [n.id, n.nome])], v:c.negocio_id ?? ''},
    {k:'valor', l:'Quanto vale se fechar (R$)', v: deCentavos(c.valor_centavos), ph:'0,00',
     dica:'Palpite serve. É o que faz o funil somar.'},
    {k:'origem', l:'Veio de onde', t:'select',
     opts:[['site','Site'],['indicação','Indicação'],['instagram','Instagram'],
           ['prospecção','Prospecção fria'],['evento','Evento'],['outro','Outro']], v:c.origem ?? 'indicação'},
    {k:'anotacao', l:'Contexto', t:'textarea', v:c.anotacao,
     dica:'Duas linhas sobre a situação dela. É o que te salva quando ela responder daqui a três semanas.'},
  ], id ? 'Salvar' : 'Criar contato');
  if(!v) return;
  if(!v.nome.trim()) return aviso('O contato precisa de um nome.');

  const row = {
    nome: v.nome.trim(), whatsapp: so(v.whatsapp) || null, email: v.email.trim() || null,
    empresa: v.empresa.trim() || null, cidade: v.cidade.trim() || null,
    negocio_id: v.negocio_id || null, valor_centavos: paraCentavos(v.valor),
    origem: v.origem, anotacao: v.anotacao.trim() || null,
  };
  const salvo = id ? await api.upd('crm_contatos', id, row)
                   : await api.ins('crm_contatos', { ...row, etapa: 'novo' });
  if(!salvo) return;
  await recarregar();
  aviso(id ? 'Dados salvos.' : 'Contato criado.');
  if(!id) location.hash = '#/contato/' + salvo.id; else rotear();
}

$('#btnNovo').onclick = () => formContato();

TELAS.tarefas = async () => {
  const todas = [...M.tarefas].sort((a,b) => Number(a.feito) - Number(b.feito) || a.vence_em.localeCompare(b.vence_em));
  const atrasadas = todas.filter(t => !t.feito && t.vence_em <  hoje());
  const deHoje    = todas.filter(t => !t.feito && t.vence_em === hoje());
  const adiante   = todas.filter(t => !t.feito && t.vence_em >  hoje());
  const feitas    = todas.filter(t => t.feito).slice(0, 12);

  const bloco = (titulo, dica, lista, cor) => `
    <div class="painel" style="margin-bottom:16px">
      <div class="painel-hd"><div>
        <h2 style="${cor ? `color:${cor}` : ''}">${esc(titulo)} ${lista.length ? `<span style="color:var(--ink-3);font-weight:600">${lista.length}</span>` : ''}</h2>
        <p class="hint">${esc(dica)}</p></div></div>
      ${lista.length ? lista.map(t => linhaTarefa(t)).join('') : `<div class="vazio">Nada aqui.</div>`}
    </div>`;

  $('#conteudo').innerHTML =
      bloco('Atrasadas', 'Estas custam dinheiro. Resolva ou reagende.', atrasadas, atrasadas.length ? 'var(--verm)' : '')
    + bloco('Para hoje', 'O que você combinou de fazer hoje.', deHoje)
    + bloco('Mais para frente', 'Já agendadas, sem pressa agora.', adiante)
    + (feitas.length ? bloco('Feitas recentemente', 'As doze últimas.', feitas) : '');

  ligarTarefas();
};

          <p class="hint">O que entrou de verdade neste mês.</p></div></div>
        ${doMes.length ? `<table>
          <thead><tr><th>Descrição</th><th>Negócio</th><th>Quando</th>
            <th style="text-align:right">Valor</th><th></th></tr></thead>
          <tbody>${doMes.map(r => {
            const c = M.contatos.find(x => x.id === r.contato_id);
            return `<tr>
              <td><b>${esc(r.descricao)}</b>${c ? `<br><span style="color:var(--ink-3);font-size:11.5px">${esc(c.nome)}</span>` : ''}</td>
              <td>${chipNegocio(negocioDe(r.negocio_id))}</td>
              <td style="white-space:nowrap">${dataBR(r.recebido_em)}<br>
                <span style="color:var(--ink-3);font-size:11.5px">${esc(r.metodo || '')}</span></td>
              <td style="text-align:right;font-weight:800;white-space:nowrap">${BRL(r.valor_centavos)}</td>
              <td style="text-align:right"><button class="btn btn-g btn-sm" data-delrec="${r.id}">✕</button></td>
            </tr>`;
          }).join('')}</tbody></table>`
        : '<div class="vazio"><b>Nada neste mês</b>Lance a primeira entrada no botão acima.</div>'}
      </div>

      <div style="display:grid;gap:18px">
        <div class="painel">
          <h2>Por negócio</h2>
          <p class="hint">De onde veio o dinheiro do mês.</p>
          ${porNeg.length ? porNeg.map(({n, total: t}) => `
            <div class="barra-item">
              <div class="barra-topo"><span>${esc(n.nome)}</span><b>${BRL(t)}</b></div>
              <div class="barra"><i style="width:${Math.round(t/maior*100)}%;background:${esc(n.cor)}"></i></div>
            </div>`).join('') : '<div class="vazio">Sem dados.</div>'}
        </div>
        <div class="painel">
          <h2>Como recebeu</h2>
          <p class="hint">Serve para saber quanto some em taxa.</p>
          ${porMetodo.length ? porMetodo.map(({m, total: t}) => `
            <div class="barra-item">
              <div class="barra-topo"><span>${esc(m)}</span><b>${BRL(t)}</b></div>
              <div class="barra"><i style="width:${Math.round(t/(porMetodo[0].total||1)*100)}%;background:var(--verde)"></i></div>
            </div>`).join('') : '<div class="vazio">Sem dados.</div>'}
        </div>
      </div>
    </div>`;

  $('#fMes').onchange = e => { mesVendo = e.target.value; rotear(); };
  $('#novaReceita').onclick = async () => {
    const v = await formModal('Receita avulsa', [
      {k:'descricao', l:'Descrição', ph:'30 Prompts para a Rotina Vet'},
      {k:'valor', l:'Valor (R$)', ph:'0,00'},
      {k:'negocio_id', l:'Negócio', t:'select',
       opts:[['','sem negócio'], ...M.negocios.map(n => [n.id, n.nome])], v:M.negocios[0]?.id ?? ''},
      {k:'metodo', l:'Como recebeu', t:'select',
       opts:[['pix','Pix'],['cartão','Cartão'],['boleto','Boleto'],['dinheiro','Dinheiro'],['outro','Outro']], v:'pix'},
      {k:'recebido_em', l:'Data', t:'date', v: hoje()},
    ], 'Lançar');
    if(!v || paraCentavos(v.valor) <= 0) return aviso('Coloque um valor.');
    await api.ins('crm_receitas', { contato_id: null, negocio_id: v.negocio_id || null,
      descricao: v.descricao || 'Receita', valor_centavos: paraCentavos(v.valor),
      metodo: v.metodo, recebido_em: v.recebido_em });
    mesVendo = String(v.recebido_em).slice(0,7);
    await recarregar(); rotear(); aviso('Receita lançada.');
  };
  $$('[data-delrec]').forEach(b => b.onclick = async () => {
    await api.del('crm_receitas', { id: b.dataset.delrec });
    await recarregar(); rotear(); aviso('Lançamento removido.');
  });
};

        ${grupos.map(g => {

const CORES = [['#30a560','Verde'],['#26874e','Verde escuro'],['#1f6e3f','Verde mata'],
               ['#2f4f3f','Verde neutro'],['#c9822f','Âmbar'],['#a3641f','Terra'],
               ['#2f6f8a','Azul'],['#b4453a','Vermelho'],['#3d4541','Cinza'],['#292827','Grafite']];

async function formNegocio(id){
  const n = id ? M.negocios.find(x => x.id === id) : {};
  const v = await formModal(id ? 'Editar negócio' : 'Novo negócio', [
    {k:'nome', l:'Nome', v:n.nome, ph:'ZeloVet'},
    {k:'cor', l:'Cor', t:'select', opts:CORES, v:n.cor ?? '#30a560'},
    {k:'ordem', l:'Ordem na lista', v:String(n.ordem ?? 50)},
  ], id ? 'Salvar' : 'Criar');
  if(!v || !v.nome.trim()) return;
  const row = { nome:v.nome.trim(), cor:v.cor, ordem:+v.ordem || 50 };
  const ok = id ? await api.upd('crm_negocios', id, row)
                : await api.ins('crm_negocios', { ...row, ativo:true });
  if(!ok) return;
  await recarregar(); rotear(); aviso('Negócio salvo.');
}

async function formTag(id){
  const t = id ? M.tags.find(x => x.id === id) : {};
  const usos = id ? M.vinculos.filter(v => v.tag_id === id).length : 0;
  const v = await formModal(id ? 'Editar etiqueta' : 'Nova etiqueta', [
    {k:'nome', l:'Nome', v:t.nome, ph:'Pet shop'},
    {k:'grupo', l:'Grupo', t:'select',
     opts:[['nicho','Nicho, o que a pessoa é'],['porte','Porte'],
           ['temperatura','Temperatura'],['canal','Canal de origem']], v:t.grupo ?? 'nicho'},
    {k:'cor', l:'Cor', t:'select', opts:CORES, v:t.cor ?? '#565c58'},
    {k:'ordem', l:'Ordem', v:String(t.ordem ?? 50)},
    ...(id ? [{k:'apagar', l:'Apagar esta etiqueta', t:'select',
               opts:[['nao','Não'],['sim','Sim, apagar']], v:'nao',
               dica: usos ? `Ela está em ${usos} contato(s). Apagar tira dela todos eles.` : 'Ninguém usa esta etiqueta.'}] : []),
  ], id ? 'Salvar' : 'Criar');
  if(!v) return;

  if(id && v.apagar === 'sim'){
    await api.del('crm_contato_tags', { tag_id: id });
    await api.del('crm_tags', { id });
    await recarregar(); rotear(); return aviso('Etiqueta apagada.');
  }
  if(!v.nome.trim()) return;
  const row = { nome:v.nome.trim(), grupo:v.grupo, cor:v.cor, ordem:+v.ordem || 50 };
  const ok = id ? await api.upd('crm_tags', id, row) : await api.ins('crm_tags', row);
  if(!ok) return;
  await recarregar(); rotear(); aviso('Etiqueta salva.');
}

let TEMA = matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
const aplicarTema = t => { document.documentElement.dataset.tema = t;
  try{ localStorage.setItem('crm_tema', t); }catch(e){} };
try{ TEMA = localStorage.getItem('crm_tema') || TEMA; }catch(e){}
aplicarTema(TEMA);
$('#btnTema').onclick = () => { TEMA = TEMA === 'escuro' ? 'claro' : 'escuro'; aplicarTema(TEMA); };

$('#btnSair').onclick = async () => {
  if(sb) await sb.auth.signOut();
  location.reload();
};

async function entrar(){
  $('#auth').classList.add('hide');
  $('#app').classList.remove('hide');
  await recarregar();
  if(!location.hash) location.hash = '#/painel';
  rotear();
}

(async function boot(){
  if(DEMO){
    $('#aNota').textContent = 'Modo demonstração. Clique em Entrar para ver com dados de mentira.';
    EU = { nome:'Wendell' };
    $('#aEntrar').onclick = () => entrar();
    return;
  }

  try{
    const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    sb = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  }catch(e){
    $('#aNota').textContent = 'Não consegui carregar a biblioteca do Supabase. Confira a internet e recarregue.';
    return;
  }

  /* Só admin passa. A RLS já barra no banco, mas avisar aqui é mais gentil. */
  async function conferir(user){
    const { data } = await sb.from('perfis').select('papel,nome').eq('id', user.id).single();
    if(data?.papel !== 'admin'){
      await sb.auth.signOut();
      $('#aNota').textContent = 'Esta conta não é administradora.';
      return false;
    }
    EU = { nome: data.nome || user.email };
    return true;
  }

  const { data:{ session } } = await sb.auth.getSession();
  if(session && await conferir(session.user)) return entrar();

  $('#aEntrar').onclick = async () => {
    const email = $('#aEmail').value.trim(), senha = $('#aSenha').value;
    if(!email || !senha) return aviso('Preencha e-mail e senha.');
    const b = $('#aEntrar'); b.disabled = true; $('#aNota').textContent = '';
    const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });
    b.disabled = false;
    if(error){ $('#aNota').textContent = 'E-mail ou senha não conferem.'; return; }
    if(await conferir(data.user)) entrar();
  };
  $('#aSenha').onkeydown = e => { if(e.key === 'Enter') $('#aEntrar').click(); };
})();
</script>
